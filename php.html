<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP & HTML Formatter</title>

    <!-- Highlight.js (シンタックスハイライト) CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn-format {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-format:hover {
            background-color: #2980b9;
        }
        .editor-container {
            display: flex;
            gap: 20px;
        }
        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }
        .output-wrapper {
            position: relative;
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #0d1117;
            overflow: auto;
        }
        pre {
            margin: 0;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            background: transparent !important;
        }
        .btn-copy {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            font-size: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
        }
        .btn-copy:hover {
            background-color: #2ea043;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>PHP & HTML Formatter</h1>

    <div class="controls">
        <select id="language-select">
            <option value="html">HTML</option>
            <option value="php">PHP</option>
        </select>
        <button class="btn-format" onclick="formatCode()">コードを整形する</button>
    </div>

    <div class="editor-container">
        <div class="editor-box">
            <label for="input-code"><strong>入力 (未整形):</strong></label>
            <textarea id="input-code" placeholder="ここにコードを貼り付けてください..."></textarea>
        </div>
        <div class="editor-box">
            <label><strong>出力 (整形済み):</strong></label>
            <div class="output-wrapper">
                <button class="btn-copy" onclick="copyToClipboard()" id="copy-btn">コピー</button>
                <pre><code id="output-code"></code></pre>
            </div>
            <div id="error-output" class="error-message"></div>
        </div>
    </div>

    <script type="module">
        import prettier from 'https://unpkg.com/prettier@3.2.5/standalone.mjs';
        import parserHtml from 'https://unpkg.com/prettier@3.2.5/plugins/html.mjs';
        import pluginPhp from 'https://unpkg.com/@prettier/plugin-php@0.22.2/standalone.mjs';

        // HTMLのonclickから呼び出せるようにwindowオブジェクトに登録
        window.formatCode = async function() {
            const inputCode = document.getElementById('input-code').value;
            const language = document.getElementById('language-select').value;
            const outputArea = document.getElementById('output-code');
            const errorArea = document.getElementById('error-output');
            
            errorArea.textContent = '';
            outputArea.textContent = '';
            outputArea.removeAttribute('data-highlighted');

            if (!inputCode.trim()) return;

            try {
                let formattedCode = '';

                if (language === 'html') {
                    formattedCode = await prettier.format(inputCode, {
                        parser: "html",
                        plugins: [parserHtml]
                    });
                } else if (language === 'php') {
                    formattedCode = await prettier.format(inputCode, {
                        parser: "php",
                        plugins: [pluginPhp]
                    });
                }

                outputArea.textContent = formattedCode;
                outputArea.className = 'language-' + language;

                hljs.highlightElement(outputArea);

            } catch (error) {
                errorArea.textContent = "整形エラー:\n" + error.message;
            }
        };

        window.copyToClipboard = function() {
            const outputCode = document.getElementById('output-code').textContent;
            const copyBtn = document.getElementById('copy-btn');

            if (!outputCode) return;

            navigator.clipboard.writeText(outputCode).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'コピー完了！';
                copyBtn.style.backgroundColor = '#1f6feb';

                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.backgroundColor = '#238636';
                }, 2000);
            }).catch(err => {
                alert('コピーに失敗しました: ' + err);
            });
        };
    </script>
</body>
</html>
